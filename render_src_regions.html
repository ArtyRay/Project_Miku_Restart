<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Render regions — Project Miku</title>
<style>
  html, body { margin: 0; padding: 0; scroll-behavior: auto; background: #fff; }
  .stage { display: block; width: 720px; height: 360px; }
  svg { display: block; }
</style>
</head>
<body>

<!-- ================= РАВНИНЫ ================= -->
<div class="stage" id="region-plains">
<svg width="720" height="360" viewBox="0 0 720 360" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="pSky" x1="0" y1="0" x2="0" y2="1">

    <linearGradient id="pHillB" x1="0" y1="0" x2="0" y2="1">

      <stop offset="100%" stop-color="#9ad0a8"/>

    <linearGradient id="pHillF" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8fce9a"/>
      <stop offset="100%" stop-color="#6fb087"/>
    </linearGradient>
  </defs>
  <rect width="720" height="360" fill="url(#pSky)"/>
  <circle cx="600" cy="80" r="46" fill="#fff8dd" opacity="0.9"/>
  <circle cx="600" cy="80" r="90" fill="#fff8dd" opacity="0.25"/>
  <g fill="#ffffff" opacity="0.92">
    <ellipse cx="150" cy="90" rx="95" ry="28"/>
    <ellipse cx="215" cy="78" rx="60" ry="24"/>
    <ellipse cx="100" cy="82" rx="52" ry="20"/>

    <ellipse cx="500" cy="150" rx="80" ry="24"/>
    <ellipse cx="545" cy="142" rx="50" ry="20"/>
    <ellipse cx="505" cy="162" rx="88" ry="16" fill="#cdeefa"/>
  </g>
  <g stroke="#4a7d8a" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.45">
    <path d="M360 70 q 9 -11 18 0 q 9 -11 18 0"/>
    <path d="M400 55 q 7 -9 14 0 q 7 -9 14 0"/>
  </g>
  <path d="M0 260 C 160 225 320 275 480 250 C 610 230 680 260 720 245 L 720 360 L 0 360 Z" fill="url(#pHillB)"/>
  <path d="M0 300 C 200 265 420 315 620 290 C 665 284 695 292 720 288 L 720 360 L 0 360 Z" fill="url(#pHillF)"/>
  <g opacity="0.85">
    <circle cx="90" cy="308" r="3.5" fill="#f7b8d0"/>
    <circle cx="200" cy="292" r="3" fill="#ffe9a8"/>
    <circle cx="330" cy="310" r="3.5" fill="#c9aef5"/>
    <circle cx="460" cy="296" r="3" fill="#f7b8d0"/>
    <circle cx="590" cy="308" r="3.5" fill="#ffe9a8"/>
    <circle cx="680" cy="298" r="3" fill="#c9aef5"/>
  </g>
</svg>
</div>

<!-- ================= ЗОЛОТЫЕ СКАЛЫ ================= -->
<div class="stage" id="region-cliffs">
<svg width="720" height="360" viewBox="0 0 720 360" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="cSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f5dc9e"/>
      <stop offset="60%" stop-color="#faedcb"/>
      <stop offset="100%" stop-color="#fdf6e3"/>
    </linearGradient>
    <linearGradient id="cRockB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#eecb8f"/>
      <stop offset="100%" stop-color="#dcae60"/>
    </linearGradient>
    <linearGradient id="cRockF" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d9a94f"/>
      <stop offset="100%" stop-color="#bc8a33"/>
    </linearGradient>
  </defs>
  <rect width="720" height="360" fill="url(#cSky)"/>
  <circle cx="120" cy="80" r="44" fill="#fffbe8" opacity="0.95"/>
  <circle cx="120" cy="80" r="85" fill="#fffbe8" opacity="0.3"/>
  <path d="M0 250 L90 170 L190 235 L320 150 L430 240 L560 165 L680 240 L720 220 L720 360 L0 360 Z" fill="url(#cRockB)"/>
  <path d="M0 290 L140 215 L280 285 L420 200 L560 285 L680 225 L720 270 L720 360 L0 360 Z" fill="url(#cRockF)"/>

  </g>
  <g stroke="#4a7d8a" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.4">
    <path d="M600 90 q 9 -11 18 0 q 9 -11 18 0"/>
    <path d="M640 105 q 7 -9 14 0 q 7 -9 14 0"/>
  </g>
</svg>
</div>

<!-- ================= ГРОЗОВЫЕ ОСТРОВА ================= -->
<div class="stage" id="region-storm">
<svg width="720" height="360" viewBox="0 0 720 360" xmlns="http://www.w3.org/2000/svg">
  <defs>

      <stop offset="0%" stop-color="#b3a2e4"/>
      <stop offset="60%" stop-color="#d5c9f2"/>
      <stop offset="100%" stop-color="#ecf2fb"/>
    </linearGradient>
    <linearGradient id="sIsl" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a98fe0"/>
      <stop offset="100%" stop-color="#7d63c0"/>
    </linearGradient>
  </defs>
  <rect width="720" height="360" fill="url(#sSky)"/>
  <g fill="#ffffff" opacity="0.75">
    <ellipse cx="560" cy="80" rx="110" ry="30"/>
    <ellipse cx="630" cy="70" rx="70" ry="25"/>
    <ellipse cx="505" cy="74" rx="60" ry="22"/>
    <ellipse cx="180" cy="150" rx="80" ry="24"/>
    <ellipse cx="230" cy="142" rx="52" ry="20"/>
  </g>
  <path d="M430 30 L 452 78 L 500 50 L 478 98 L 530 66 L 486 118 L 442 112 L 372 132 L 322 66 Z" fill="#f4c97a" opacity="0.95"/>

  <ellipse cx="470" cy="46" rx="8" ry="12" fill="#f4c97a" opacity="0.45" transform="rotate(14 470 46)"/>
  <ellipse cx="80" cy="260" rx="180" ry="60" fill="url(#sIsl)"/>
  <ellipse cx="520" cy="300" rx="240" ry="70" fill="#7d63c0"/>
  <ellipse cx="640" cy="280" rx="150" ry="50" fill="#6a52ad"/>
  <path d="M70 250 q 8 -16 16 0 q 8 -16 16 0 M600 290 q 7 -14 14 0 q 7 -14 14 0" stroke="#5a4499" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.6"/>
  <circle cx="150" cy="120" r="1.8" fill="#fff"/>
  <circle cx="680" cy="70" r="1.6" fill="#fff"/>
  <circle cx="300" cy="60" r="1.5" fill="#fff"/>
</svg>
</div>

<!-- ================= ТУМАННЫЕ ЛЕСА ================= -->
<div class="stage" id="region-forest">
<svg width="720" height="360" viewBox="0 0 720 360" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="fSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a5d8a0"/>
      <stop offset="60%" stop-color="#ceecc4"/>
      <stop offset="100%" stop-color="#eaf7e4"/>
    </linearGradient>
    <linearGradient id="fHill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6fb087"/>
      <stop offset="100%" stop-color="#4f8a5f"/>
    </linearGradient>
  </defs>
  <rect width="720" height="360" fill="url(#fSky)"/>
  <circle cx="560" cy="70" r="40" fill="#f2fbe8" opacity="0.85"/>
  <circle cx="560" cy="70" r="80" fill="#f2fbe8" opacity="0.25"/>
  <g fill="#ffffff" opacity="0.75">
    <ellipse cx="170" cy="120" rx="85" ry="26"/>
    <ellipse cx="225" cy="112" rx="55" ry="22"/>

  </g>
  <path d="M0 280 C 150 240 320 300 480 270 C 600 245 680 275 720 260 L 720 360 L 0 360 Z" fill="url(#fHill)"/>
  <path d="M95 150 L 130 60 L 165 150 Z" fill="#3f7a4e"/>
  <path d="M165 160 L 205 55 L 245 160 Z" fill="#4f8a5f"/>
  <path d="M235 155 L 270 70 L 305 155 Z" fill="#3f7a4e"/>

  <path d="M385 170 L 420 85 L 455 170 Z" fill="#3f7a4e"/>
  <path d="M640 165 L 665 100 L 690 165 Z" fill="#4f8a5f"/>
  <g opacity="0.85">
    <circle cx="100" cy="310" r="3.5" fill="#f7b8d0"/>
    <circle cx="260" cy="296" r="3" fill="#ffe9a8"/>
    <circle cx="420" cy="312" r="3.5" fill="#c9aef5"/>

  <g stroke="#4a7d8a" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.4">
    <path d="M60 60 q 8 -10 16 0 q 8 -10 16 0"/>
  </g>
</svg>
</div>

<script>
(function () {
  var id = location.hash.slice(1);
  if (id) {
    var el = document.getElementById(id);
    if (el) el.scrollIntoView({ block: 'start' });
  }
})();
</script>
</body>
</html>
